# Deploy static Next.js export to Timeweb FTP after validation.

name: Deploy to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate, build and deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://metallmontage33.ru/

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks and production build
        run: npm run ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end checks
        run: npm run test:e2e

      - name: Run accessibility checks
        run: npm run test:a11y

      - name: Install the FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Deploy out/ to Timeweb
        env:
          TIMEWEB_FTP_SERVER: ${{ secrets.TIMEWEB_FTP_SERVER }}
          TIMEWEB_FTP_USERNAME: ${{ secrets.TIMEWEB_FTP_USERNAME }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
        run: |
          lftp "$TIMEWEB_FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          user "$TIMEWEB_FTP_USERNAME" "$TIMEWEB_FTP_PASSWORD"
          mirror --reverse --delete --verbose --parallel=2 \
            --exclude-glob .well-known/** \
            ./out/ /
          bye
          LFTP
