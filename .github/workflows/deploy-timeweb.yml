# Validate every pull request and deploy a verified static export from main.

name: Validate and deploy to Timeweb

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, build and browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks and production build
        run: npm run ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end checks
        run: npm run test:e2e

      - name: Run accessibility checks
        run: npm run test:a11y

      - name: Run cross-browser smoke checks
        run: npm run test:cross-browser

      - name: Upload verified static export
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: out/
          if-no-files-found: error

  visual:
    name: Visual regression (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static export
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run visual regression checks
        run: npm run test:visual

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, visual]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://metallmontage33.ru/

    steps:
      - name: Download verified static export
        uses: actions/download-artifact@v8
        with:
          name: static-export
          path: out/

      - name: Install the FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Deploy out/ to Timeweb
        env:
          TIMEWEB_FTP_SERVER: ${{ secrets.TIMEWEB_FTP_SERVER }}
          TIMEWEB_FTP_USERNAME: ${{ secrets.TIMEWEB_FTP_USERNAME }}
          TIMEWEB_FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
        run: |
          lftp "$TIMEWEB_FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          user "$TIMEWEB_FTP_USERNAME" "$TIMEWEB_FTP_PASSWORD"
          mirror --reverse --delete --verbose --parallel=2 \
            --exclude-glob .well-known/** \
            ./out/ /
          bye
          LFTP
